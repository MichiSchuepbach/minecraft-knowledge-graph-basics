name: CI/CD pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test-publish-deploy:
    runs-on: ubuntu-latest
    
    env:
      FORCE_COLOR: "1"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up dependencies
        run: make setup

      - name: Build processed RDF graph
        run: make build

      - name: Run tests
        run: make test
